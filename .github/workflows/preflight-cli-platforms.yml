name: Preflight CLI platforms

on:
  pull_request:
    paths:
      - 'src/main/ipc/preflight*'
      - 'src/main/ipc/agent-detection-shell-path.ts'
      - 'src/main/ipc/command-path-resolver*'
      - 'src/main/preflight/**'
      - 'src/main/startup/*shell*'
      - 'src/packages/process-host/**'
      - '.github/actions/install-node-dependencies/**'
      - '.github/workflows/preflight-cli-platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preflight-cli-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Preflight CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          cache-electron-package: 'true'
      - name: Diagnose barrier with the current 2 s taskkill cap
        if: false
        run: pnpm exec vitest run --config config/vitest.config.ts src/main/ipc/zz-diag-taskkill.win32.test.ts --reporter=verbose
      - name: Diagnose barrier with a 15 s taskkill cap
        if: false
        env:
          ORCA_DIAG_TASKKILL_MS: '15000'
        run: pnpm exec vitest run --config config/vitest.config.ts src/main/ipc/zz-diag-taskkill.win32.test.ts --reporter=verbose
      - name: Diagnose stop-test root removal under load
        if: always()
        run: pnpm exec vitest run --config config/vitest.config.ts src/main/orcad/zz-diag-stop-rm.win32.test.ts --reporter=verbose
